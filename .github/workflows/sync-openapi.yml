name: Sync Lichess OpenAPI

# Regenerates the client from Lichess's upstream OpenAPI spec on a schedule.
# When the generated client changes, it opens a PR for review — the spec is
# never vendored, so this is the only thing that keeps equine in sync.

on:
  schedule:
    - cron: '0 6 * * 1' # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate client from upstream spec
        run: pnpm codegen

      - name: Verify it still builds
        run: pnpm build

      - name: Open PR if the client changed
        uses: peter-evans/create-pull-request@v6
        with:
          # A PR opened with the default GITHUB_TOKEN does NOT trigger other
          # workflows (e.g. ci.yml), so the sync PR would have no checks. Use a
          # PAT/App token to make CI run on it — add a `SYNC_TOKEN` repo secret
          # (a fine-grained PAT with contents+pull-requests write). Falls back
          # to GITHUB_TOKEN if unset (PR still opens, just without CI).
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: 'chore: sync Lichess OpenAPI spec'
          title: 'chore: sync Lichess OpenAPI spec'
          body: |
            Automated regeneration of the client from the upstream
            [Lichess OpenAPI spec](https://github.com/lichess-org/api).

            Generated by the `Sync Lichess OpenAPI` workflow. Review the diff
            in `src/client/` before merging.
          branch: chore/sync-openapi
          delete-branch: true
          add-paths: |
            src/client/**
